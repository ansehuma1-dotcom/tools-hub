<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loan EMI Calculator — Tools Hub</title><meta name="description" content="Calculate monthly loan EMI, total interest and total payment."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="loan_title">Loan EMI Calculator — Tools Hub</h1><p data-i18n="loan_intro">Enter the loan amount, annual interest rate and time in months.</p><div class="toolbox"><label>Loan amount</label><input id="p" type="number" min="1" step="any" placeholder="e.g. 100000"><label>Annual interest rate (%)</label><input id="r" type="number" min="0" step="any" placeholder="e.g. 12"><label>Time (months)</label><input id="n" type="number" min="1" step="1" placeholder="e.g. 12"><p><button class="btn pink" onclick="calc()" data-i18n="calc_loan">Calculate EMI</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var P=parseFloat(document.getElementById('p').value),R=parseFloat(document.getElementById('r').value),N=parseFloat(document.getElementById('n').value);if(!P||R<0||!N){alert('Please enter amount, rate and months.');return}var r=R/1200,emi=R===0?P/N:P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1);var total=emi*N;var o=document.getElementById('out');o.style.display='block';o.textContent='Monthly EMI: '+emi.toFixed(2)+'\nTotal payment: '+total.toFixed(2)+'\nTotal interest: '+(total-P).toFixed(2)}</script><script src="lang.js"></script></body></html>
