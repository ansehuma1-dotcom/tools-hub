<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loan EMI Calculator — Tools Hub</title><meta name="description" content="Calculate monthly loan EMI, total interest and total payment."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>Loan EMI Calculator — Tools Hub</h1><p>Enter the loan amount, annual interest rate and time in months.</p><div class="toolbox"><label>Loan amount</label><input id="p" type="number" min="1" step="any" placeholder="e.g. 100000"><label>Annual interest rate (%)</label><input id="r" type="number" min="0" step="any" placeholder="e.g. 12"><label>Time (months)</label><input id="n" type="number" min="1" step="1" placeholder="e.g. 12"><p><button class="btn pink" onclick="calc()">Calculate EMI</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var P=parseFloat(document.getElementById('p').value),R=parseFloat(document.getElementById('r').value),N=parseFloat(document.getElementById('n').value);if(!P||R<0||!N){alert('Please enter amount, rate and months.');return}var r=R/1200,emi=R===0?P/N:P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1);var total=emi*N;var o=document.getElementById('out');o.style.display='block';o.textContent='Monthly EMI: '+emi.toFixed(2)+'\nTotal payment: '+total.toFixed(2)+'\nTotal interest: '+(total-P).toFixed(2)}</script></body></html>
