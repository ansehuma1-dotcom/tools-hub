<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Age Calculator — Tools Hub</title><meta name="description" content="Calculate your exact age from your date of birth."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>Age Calculator — Tools Hub</h1><p>Pick your date of birth to get your age in years, months and days.</p><div class="toolbox"><label>Date of birth</label><input id="d" type="date"><p><button class="btn teal" onclick="calc()">Calculate Age</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var v=document.getElementById('d').value;if(!v){alert('Please pick a date.');return}var b=new Date(v),t=new Date();if(b>t){alert('Date of birth cannot be in the future.');return}var y=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth(),d=t.getDate()-b.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}var o=document.getElementById('out');o.style.display='block';o.textContent='You are '+y+' years, '+m+' months and '+d+' days old.'}</script></body></html>
