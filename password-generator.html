<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password Generator — Tools Hub</title><meta name="description" content="Generate a strong random password in your browser."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="password_title">Password Generator — Tools Hub</h1><p data-i18n="password_intro">Choose length and character types, then generate. Nothing is stored.</p><div class="toolbox"><label>Length</label><input id="l" type="number" min="4" max="64" value="16"><label><input type="checkbox" id="up" checked style="width:auto"> Uppercase (A-Z)</label><label><input type="checkbox" id="lo" checked style="width:auto"> Lowercase (a-z)</label><label><input type="checkbox" id="nu" checked style="width:auto"> Numbers (0-9)</label><label><input type="checkbox" id="sy" checked style="width:auto"> Symbols (!@#$)</label><p><button class="btn" onclick="gen()" data-i18n="gen_password">Generate Password</button> <button class="btn pink" onclick="copyP()">Copy</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>var _pw='';function gen(){var len=parseInt(document.getElementById('l').value)||16;var chars='';if(document.getElementById('up').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.getElementById('lo').checked)chars+='abcdefghijklmnopqrstuvwxyz';if(document.getElementById('nu').checked)chars+='0123456789';if(document.getElementById('sy').checked)chars+='!@#$%^&*';if(!chars){alert('Pick at least one character type.');return}var p='';for(var i=0;i<len;i++)p+=chars[Math.floor(Math.random()*chars.length)];var o=document.getElementById('out');o.style.display='block';o.textContent=p;_pw=p}function copyP(){if(!_pw){gen()}if(navigator.clipboard)navigator.clipboard.writeText(_pw);alert('Password copied.')}</script><script src="lang.js"></script></body></html>
