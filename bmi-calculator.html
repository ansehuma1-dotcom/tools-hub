<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BMI Calculator — Tools Hub</title><meta name="description" content="Calculate your BMI from height and weight."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="bmi_title">BMI Calculator — Tools Hub</h1><p data-i18n="bmi_intro">Enter your height and weight to get your BMI and category.</p><div class="toolbox"><label>Weight (kg)</label><input id="w" type="number" min="1" step="any" placeholder="e.g. 70"><label>Height (cm)</label><input id="h" type="number" min="1" step="any" placeholder="e.g. 175"><p><button class="btn" onclick="calc()" data-i18n="calc_bmi">Calculate BMI</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var w=parseFloat(document.getElementById('w').value),h=parseFloat(document.getElementById('h').value);if(!w||!h){alert('Please enter weight and height.');return}var m=h/100,bmi=w/(m*m);var cat=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';var o=document.getElementById('out');o.style.display='block';o.textContent='BMI: '+bmi.toFixed(1)+' — '+cat}</script><script src="lang.js"></script></body></html>
