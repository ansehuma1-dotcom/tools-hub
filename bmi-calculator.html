<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BMI Calculator — Tools Hub</title><meta name="description" content="Calculate your BMI from height and weight."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>BMI Calculator — Tools Hub</h1><p>Enter your height and weight to get your BMI and category.</p><div class="toolbox"><label>Weight (kg)</label><input id="w" type="number" min="1" step="any" placeholder="e.g. 70"><label>Height (cm)</label><input id="h" type="number" min="1" step="any" placeholder="e.g. 175"><p><button class="btn" onclick="calc()">Calculate BMI</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var w=parseFloat(document.getElementById('w').value),h=parseFloat(document.getElementById('h').value);if(!w||!h){alert('Please enter weight and height.');return}var m=h/100,bmi=w/(m*m);var cat=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';var o=document.getElementById('out');o.style.display='block';o.textContent='BMI: '+bmi.toFixed(1)+' — '+cat}</script></body></html>
