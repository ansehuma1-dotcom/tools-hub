<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Random Number Generator — Tools Hub</title><meta name="description" content="Generate random numbers in any range."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>Random Number Generator — Tools Hub</h1><p>Enter a minimum, maximum and how many numbers you want.</p><div class="toolbox"><label>Minimum</label><input id="mn" type="number" value="1"><label>Maximum</label><input id="mx" type="number" value="100"><label>How many?</label><input id="c" type="number" min="1" max="100" value="1"><label><input type="checkbox" id="uq" style="width:auto"> No repeats</label><p><button class="btn teal" onclick="gen()">Generate</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function gen(){var mn=parseInt(document.getElementById('mn').value),mx=parseInt(document.getElementById('mx').value),c=parseInt(document.getElementById('c').value)||1;if(isNaN(mn)||isNaN(mx)||mn>mx){alert('Minimum must be less than maximum.');return}if(document.getElementById('uq').checked&&c>(mx-mn+1)){alert('Not enough unique numbers in this range.');return}var out=[];while(out.length<c){var n=Math.floor(Math.random()*(mx-mn+1))+mn;if(!document.getElementById('uq').checked||out.indexOf(n)===-1)out.push(n)}var o=document.getElementById('out');o.style.display='block';o.textContent=out.join(', ')}</script></body></html>
