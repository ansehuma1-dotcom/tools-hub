<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Discount Calculator — Tools Hub</title><meta name="description" content="Calculate final price and savings after a discount."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>Discount Calculator — Tools Hub</h1><p>Enter the original price and discount percentage.</p><div class="toolbox"><label>Original price</label><input id="p" type="number" min="0" step="any" placeholder="e.g. 2000"><label>Discount (%)</label><input id="d" type="number" min="0" max="100" step="any" placeholder="e.g. 25"><p><button class="btn" onclick="calc()">Calculate Discount</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function calc(){var p=parseFloat(document.getElementById('p').value),d=parseFloat(document.getElementById('d').value);if(p<0||d<0||d>100||isNaN(p)||isNaN(d)){alert('Please enter a valid price and discount 0-100.');return}var saved=p*d/100;var o=document.getElementById('out');o.style.display='block';o.textContent='You save: '+saved.toFixed(2)+'\nFinal price: '+(p-saved).toFixed(2)}</script></body></html>
