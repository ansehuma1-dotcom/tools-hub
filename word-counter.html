<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Word Counter & Case Converter — Tools Hub</title><meta name="description" content="Count words and characters and change text case."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="word_title">Word Counter & Case Converter — Tools Hub</h1><p data-i18n="word_intro">Paste or type your text. Counts update as you type.</p><div class="toolbox"><label>Your text</label><textarea id="t" placeholder="Type or paste text here..."></textarea><p><button class="btn" onclick="upper()">UPPERCASE</button> <button class="btn teal" onclick="lower()">lowercase</button> <button class="btn pink" onclick="title()">Title Case</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function count(){var t=document.getElementById('t').value;var words=t.trim()?t.trim().split(/\s+/).length:0;var s=t.split(/[.!?]+/).filter(function(x){return x.trim()}).length;var o=document.getElementById('out');o.style.display='block';o.textContent='Words: '+words+'\nCharacters: '+t.length+'\nCharacters (no spaces): '+t.replace(/\s/g,'').length+'\nSentences: '+s+'\nReading time: about '+Math.max(1,Math.ceil(words/200))+' minute(s)'}document.getElementById('t').addEventListener('input',count);function upper(){var e=document.getElementById('t');e.value=e.value.toUpperCase();count()}function lower(){var e=document.getElementById('t');e.value=e.value.toLowerCase();count()}function title(){var e=document.getElementById('t');e.value=e.value.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()});count()}count();</script><script src="lang.js"></script></body></html>
