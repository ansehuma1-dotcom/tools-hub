<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Word Counter & Case Converter — Tools Hub</title><meta name="description" content="Count words and characters and change text case."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header><main><p><a href="index.html">← All tools</a></p><h1>Word Counter & Case Converter — Tools Hub</h1><p>Paste or type your text. Counts update as you type.</p><div class="toolbox"><label>Your text</label><textarea id="t" placeholder="Type or paste text here..."></textarea><p><button class="btn" onclick="upper()">UPPERCASE</button> <button class="btn teal" onclick="lower()">lowercase</button> <button class="btn pink" onclick="title()">Title Case</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a><p>Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function count(){var t=document.getElementById('t').value;var words=t.trim()?t.trim().split(/\s+/).length:0;var s=t.split(/[.!?]+/).filter(function(x){return x.trim()}).length;var o=document.getElementById('out');o.style.display='block';o.textContent='Words: '+words+'\nCharacters: '+t.length+'\nCharacters (no spaces): '+t.replace(/\s/g,'').length+'\nSentences: '+s+'\nReading time: about '+Math.max(1,Math.ceil(words/200))+' minute(s)'}document.getElementById('t').addEventListener('input',count);function upper(){var e=document.getElementById('t');e.value=e.value.toUpperCase();count()}function lower(){var e=document.getElementById('t');e.value=e.value.toLowerCase();count()}function title(){var e=document.getElementById('t');e.value=e.value.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()});count()}count();</script></body></html>
