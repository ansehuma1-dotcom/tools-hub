<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unit Converter — Tools Hub</title><meta name="description" content="Convert length, weight and temperature."><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="unit_title">Unit Converter — Tools Hub</h1><p data-i18n="unit_intro">Choose a type, enter a value, and pick the from and to units.</p><div class="toolbox"><label>Type</label><select id="t" onchange="setup()"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select><label>Value</label><input id="v" type="number" step="any" placeholder="e.g. 10"><label>From</label><select id="f"></select><label>To</label><select id="to"></select><p><button class="btn teal" onclick="calc()" data-i18n="convert">Convert</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>var units={length:{m:1,km:1000,cm:0.01,mm:0.001,ft:0.3048,in:0.0254,mi:1609.34},weight:{kg:1,g:0.001,lb:0.453592,oz:0.0283495,ton:1000}};function setup(){var t=document.getElementById('t').value,f=document.getElementById('f'),to=document.getElementById('to');var list=t==='temperature'?['C','F','K']:Object.keys(units[t]);f.innerHTML='';to.innerHTML='';list.forEach(function(u){f.add(new Option(u,u));to.add(new Option(u,u))});to.selectedIndex=list.length>1?1:0}setup();function calc(){var t=document.getElementById('t').value,v=parseFloat(document.getElementById('v').value),f=document.getElementById('f').value,to=document.getElementById('to').value;if(isNaN(v)){alert('Please enter a value.');return}var r;if(t==='temperature'){var c=f==='C'?v:f==='F'?(v-32)*5/9:v-273.15;r=to==='C'?c:to==='F'?c*9/5+32:c+273.15}else{r=v*units[t][f]/units[t][to]}var o=document.getElementById('out');o.style.display='block';o.textContent=v+' '+f+' = '+r.toFixed(4)+' '+to}</script><script src="lang.js"></script></body></html>
