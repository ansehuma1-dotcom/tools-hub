<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Budget Calculator — Tools Hub</title><meta name="description" content="Monthly budget calculator with the 50/30/20 rule: needs, wants and savings."><link rel="stylesheet" href="style.css?v=3"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="budget_title">Budget Calculator — Tools Hub</h1><p data-i18n="budget_intro">Enter your monthly income and spending. This is a planning estimate, not financial advice.</p><div class="toolbox"><label>Monthly income ($)</label><input id="inc" type="number" min="0" step="any" placeholder="e.g. 3000"><label>Housing / rent ($)</label><input id="hous" type="number" min="0" step="any" value="0"><label>Food ($)</label><input id="food" type="number" min="0" step="any" value="0"><label>Transport ($)</label><input id="trans" type="number" min="0" step="any" value="0"><label>Other bills ($)</label><input id="bills" type="number" min="0" step="any" value="0"><label>Entertainment / wants ($)</label><input id="fun" type="number" min="0" step="any" value="0"><label>Savings ($)</label><input id="sav" type="number" min="0" step="any" value="0"><p><button class="btn" onclick="calc()">Calculate Budget</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v}function calc(){var inc=num('inc');var o=document.getElementById('out');if(inc<=0){alert('Please enter your monthly income.');return}var total=num('hous')+num('food')+num('trans')+num('bills')+num('fun')+num('sav');var left=inc-total;var rate=inc?num('sav')/inc*100:0;o.style.display='block';o.textContent='Total spending + savings: $'+total.toFixed(2)+'\nMoney left: $'+left.toFixed(2)+'\nSavings rate: '+rate.toFixed(1)+'% of income\n\n50/30/20 suggestion for $'+inc.toFixed(2)+':\nNeeds (50%): $'+(inc*0.5).toFixed(2)+'\nWants (30%): $'+(inc*0.3).toFixed(2)+'\nSavings (20%): $'+(inc*0.2).toFixed(2)}</script><script src="lang.js"></script></body></html>
