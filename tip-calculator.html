<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tip Calculator — Tools Hub</title><meta name="description" content="Calculate tip, total bill and cost per person for restaurants in the USA and anywhere."><link rel="stylesheet" href="style.css?v=3"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="tip_title">Tip Calculator — Tools Hub</h1><p data-i18n="tip_intro">Enter the bill, tip percentage and number of people. Tap a preset tip or type your own.</p><div class="toolbox"><label>Bill amount ($)</label><input id="bill" type="number" min="0" step="any" placeholder="e.g. 50"><label>Tip (%)</label><input id="tip" type="number" min="0" step="any" value="15"><p><button class="btn" onclick="setTip(10)">10%</button> <button class="btn teal" onclick="setTip(15)">15%</button> <button class="btn pink" onclick="setTip(20)">20%</button> <button class="btn" onclick="setTip(25)">25%</button></p><label>Split between how many people?</label><input id="ppl" type="number" min="1" step="1" value="1"><p><button class="btn pink" onclick="calc()">Calculate Tip</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function setTip(v){document.getElementById('tip').value=v}function calc(){var bill=parseFloat(document.getElementById('bill').value),tip=parseFloat(document.getElementById('tip').value),ppl=parseInt(document.getElementById('ppl').value)||1;var o=document.getElementById('out');if(isNaN(bill)||bill<0||isNaN(tip)||tip<0||ppl<1){alert('Please enter a valid bill, tip and number of people.');return}var tipAmt=bill*tip/100,total=bill+tipAmt;o.style.display='block';o.textContent='Tip: $'+tipAmt.toFixed(2)+'\nTotal: $'+total.toFixed(2)+'\nPer person: $'+(total/ppl).toFixed(2)+' (for '+ppl+' people)'}</script><script src="lang.js"></script></body></html>
