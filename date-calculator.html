<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Date Calculator — Tools Hub</title><meta name="description" content="Days between two dates, business days between dates, and add or subtract days from a date."><link rel="stylesheet" href="style.css?v=3"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><header><a class="logo" href="index.html">🔧 Tools Hub</a><nav class="mainnav"><a href="index.html" data-i18n="home">Home</a><a href="about.html" data-i18n="about">About</a><a href="contact.html" data-i18n="contact">Contact</a><a href="privacy.html" data-i18n="privacy">Privacy</a><a href="terms.html" data-i18n="terms">Terms</a></nav><div class="header-actions"><label>🌐 <select id="langSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="zh">中文</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ur">اردو</option></select></label></div></header><main><p><a href="index.html" data-i18n="back">← All tools</a></p><h1 data-i18n="date_title">Date Calculator — Tools Hub</h1><p data-i18n="date_intro">Use the buttons below. Business days are Monday to Friday, not counting public holidays.</p><div class="toolbox"><label>First date</label><input id="d1" type="date"><label>Second date</label><input id="d2" type="date"><label>Days to add or subtract (use a negative number to subtract)</label><input id="n" type="number" step="1" value="30"><p><button class="btn" onclick="between()">Days Between Dates</button> <button class="btn teal" onclick="business()">Business Days Between</button> <button class="btn pink" onclick="addDays()">Add Days to First Date</button></p><div class="result" id="out" style="display:none"></div></div></main><footer><a href="about.html" data-i18n="about">About</a> · <a href="contact.html" data-i18n="contact">Contact</a> · <a href="privacy.html" data-i18n="privacy">Privacy Policy</a> · <a href="terms.html" data-i18n="terms">Terms</a><p data-i18n="footer_tag">Tools Hub — free online tools. No sign-up, no API key needed.</p></footer><script>function parseD(id){var v=document.getElementById(id).value;return v?new Date(v+'T00:00:00'):null}function showTxt(t){var o=document.getElementById('out');o.style.display='block';o.textContent=t}function between(){var a=parseD('d1'),b=parseD('d2');if(!a||!b){alert('Please pick both dates.');return}var days=Math.round(Math.abs(b-a)/86400000);showTxt('Days between: '+days+' days ('+(days/7).toFixed(1)+' weeks)')}function business(){var a=parseD('d1'),b=parseD('d2');if(!a||!b){alert('Please pick both dates.');return}if(b<a){var t=a;a=b;b=t}var count=0,cur=new Date(a);while(cur<=b){var dow=cur.getDay();if(dow!==0&&dow!==6)count++;cur.setDate(cur.getDate()+1)}showTxt('Business days (Mon-Fri, not counting holidays): '+count)}function addDays(){var a=parseD('d1'),n=parseInt(document.getElementById('n').value);if(!a||isNaN(n)){alert('Please pick a first date and enter days.');return}var r=new Date(a);r.setDate(r.getDate()+n);showTxt('Result: '+r.toISOString().slice(0,10)+' ('+r.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+')')}</script><script src="lang.js"></script></body></html>
